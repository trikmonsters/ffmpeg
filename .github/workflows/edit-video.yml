name: Video Editor + Multi Platform Upload

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:

      video_url:
        description: 'URL video sumber'
        required: true

      output_filename:
        description: 'Nama file output (tanpa .mp4)'
        required: true
        default: 'video-001'

      logo_image_url:
        description: 'URL gambar logo'
        required: false
        default: ''

      logo_width:
        description: 'Lebar logo'
        required: false
        default: '200'

      logo_position:
        description: 'Posisi logo'
        required: false
        default: 'top-center'

      logo_opacity:
        description: 'Opacity logo'
        required: false
        default: '0.9'

      logo_margin:
        description: 'Margin logo'
        required: false
        default: '20'

      post_title:
        description: 'Judul post'
        required: true
        default: 'My Short Video'

      post_description:
        description: 'Deskripsi'
        required: false
        default: 'Check this out!'

      post_tags:
        description: 'Tags'
        required: false
        default: 'shorts,viral,fyp'

      tiktok_description:
        description: 'TikTok Caption'
        required: false
        default: 'Video keren! #fyp #viral'

      upload_youtube:
        description: 'Upload YouTube'
        required: false
        default: 'true'

      upload_facebook:
        description: 'Upload Facebook'
        required: false
        default: 'true'

      upload_tiktok:
        description: 'Upload TikTok'
        required: false
        default: 'true'

      fb_access_token:
        description: 'FB Token'
        required: false
        default: ''

      fb_page_id:
        description: 'FB Page ID'
        required: false
        default: ''

jobs:
  edit-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          pip install \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2 \
            google-api-python-client \
            requests \
            Pillow
          ffmpeg -version | head -1
          echo "✅ Dependencies installed"

      - name: Prepare workspace
        run: |
          set -e
          mkdir -p media
          SAFE_NAME=$(echo "${{ github.event.inputs.output_filename }}" | tr -cd '[:alnum:]_-')
          echo "SAFE_NAME=${SAFE_NAME}" >> $GITHUB_ENV
          echo "OUTPUT_FILE=media/${SAFE_NAME}.mp4" >> $GITHUB_ENV
          echo "✅ SAFE_NAME: ${SAFE_NAME}"

      - name: Download Video
        run: |
          set -e
          echo "📥 Downloading source video..."
          curl -f -L \
            --max-time 120 \
            --retry 3 \
            --retry-delay 5 \
            -H "User-Agent: Mozilla/5.0" \
            -o input_video.mp4 \
            "${{ github.event.inputs.video_url }}"
          ffprobe input_video.mp4 > /dev/null 2>&1 || {
            echo "❌ Invalid video file"
            exit 1
          }
          echo "✅ Download OK"

      - name: Download Logo
        if: ${{ github.event.inputs.logo_image_url != '' }}
        run: |
          set -e
          curl -f -L -o logo_original.png "${{ github.event.inputs.logo_image_url }}"
          echo "✅ Logo downloaded"

      - name: Prepare Logo
        if: ${{ github.event.inputs.logo_image_url != '' }}
        run: |
          set -e
          python3 scripts/prepare_logo.py \
            --input logo_original.png \
            --output logo_ready.png \
            --width "${{ github.event.inputs.logo_width }}" \
            --opacity "${{ github.event.inputs.logo_opacity }}"

      - name: Edit Video
        run: |
          set -e
        
          POSITION="${{ github.event.inputs.logo_position }}"
          MARGIN="${{ github.event.inputs.logo_margin }}"
        
          LOGO_EXISTS=false
          [ -f "logo_ready.png" ] && LOGO_EXISTS=true
        
          echo "🎬 Processing video..."
        
          if [ "$LOGO_EXISTS" = "true" ]; then
        
          case "$POSITION" in
            top-left)      OVERLAY_X="$MARGIN";      OVERLAY_Y="$MARGIN" ;;
            top-center)    OVERLAY_X="(W-w)/2";      OVERLAY_Y="$MARGIN" ;;
            top-right)     OVERLAY_X="W-w-$MARGIN";  OVERLAY_Y="$MARGIN" ;;
            bottom-left)   OVERLAY_X="$MARGIN";      OVERLAY_Y="H-h-$MARGIN" ;;
            bottom-center) OVERLAY_X="(W-w)/2";      OVERLAY_Y="H-h-$MARGIN" ;;
            bottom-right)  OVERLAY_X="W-w-$MARGIN";  OVERLAY_Y="H-h-$MARGIN" ;;
            *)             OVERLAY_X="(W-w)/2";      OVERLAY_Y="$MARGIN" ;;
          esac
        
          ffmpeg -y \
            -i input_video.mp4 \
            -i logo_ready.png \
            -i media/transisi/GJ.mp4 \
            -filter_complex "\
        
          [0:v]scale=1440x2560:flags=lanczos,
          crop=iw*0.98:ih*0.98:(iw-iw*0.98)/2:(ih-ih*0.98)/2,
          scale=1440:2560:flags=lanczos,
          setpts=PTS/1.1,
          unsharp=5:5:2.0:5:5:0.7,
          eq=contrast=1.40:brightness=0.05:saturation=1.10:gamma=1.05,
          format=yuv420p[base];
          
          [base][1:v]overlay=${OVERLAY_X}:${OVERLAY_Y}[mainv];
          
          [0:a]atempo=1.1,
          loudnorm=I=-14:LRA=11:TP=-1.5[maina];
          
          [mainv][maina][2:v][2:a]concat=n=2:v=1:a=1[vout][aout]" 
          -map "[vout]" 
          -map "[aout]" 
          -c:v libx265 
          -tag:v hvc1 
          -r 120 
          -preset medium 
          -crf 19 
          -profile:v main 
          -level 5.1 
          -pix_fmt yuv420p 
          -movflags +faststart 
          -c:a aac 
          -b:a 192k 
          -ar 48000 
          "${{ env.OUTPUT_FILE }}"
          
          else
          
            ffmpeg -y \
              -i input_video.mp4 \
              -i media/transisi/GJ.mp4 \
              -filter_complex "\
          
          [0:v]scale=1440x2560:flags=lanczos,
          setpts=PTS/1.1,
          eq=contrast=1.45:brightness=0.01:saturation=1.08:gamma=0.95,
          format=yuv420p[mainv];
          
          [0:a]atempo=1.1,
          loudnorm=I=-14:LRA=11:TP=-1.5[maina];
          
          [mainv][maina][1:v][1:a]concat=n=2:v=1:a=1[vout][aout]" 
          -map "[vout]" 
          -map "[aout]" 
          -c:v libx264 
          -preset fast 
          -crf 22 
          -pix_fmt yuv420p 
          -movflags +faststart 
          -c:a aac 
          -b:a 192k 
          -ar 48000 
          "${{ env.OUTPUT_FILE }}"
          fi


      - name: Upload YouTube
        if: ${{ github.event.inputs.upload_youtube == 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -e
          python3 scripts/upload_youtube.py \
            --file "${{ env.OUTPUT_FILE }}" \
            --title "${{ github.event.inputs.post_title }}" \
            --description "${{ github.event.inputs.post_description }}" \
            --tags "${{ github.event.inputs.post_tags }}"

      - name: Upload Facebook Reels
        if: ${{ github.event.inputs.upload_facebook == 'true' }}
        run: |
          set -e
          python3 scripts/upload_facebook.py \
            --file "${{ env.OUTPUT_FILE }}" \
            --page-id "${{ github.event.inputs.fb_page_id }}" \
            --access-token "${{ github.event.inputs.fb_access_token }}" \
            --title "${{ github.event.inputs.post_title }}" \
            --description "${{ github.event.inputs.post_description }}" \
            --tags "${{ github.event.inputs.post_tags }}"

      - name: Hapus release lama
        if: ${{ github.event.inputs.upload_tiktok == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "🗑️ Mengecek release lama..."
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases \
            --jq '.[] | select(.tag_name == "tiktok_video") | .id' 2>/dev/null || echo "")
          if [ -n "$RELEASE_ID" ]; then
            echo "Menghapus release ID: $RELEASE_ID"
            gh api -X DELETE repos/${{ github.repository }}/releases/$RELEASE_ID
            sleep 2
            gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/tiktok_video || true
            sleep 2
            echo "✅ Release lama dihapus"
          else
            echo "ℹ️ Tidak ada release lama"
          fi

      - name: Upload video ke GitHub Release
        if: ${{ github.event.inputs.upload_tiktok == 'true' }}
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tiktok_video
          name: TikTok Video (hosting sementara)
          body: "Hosting sementara untuk Buffer API. Otomatis diganti di run berikutnya."
          files: ${{ env.OUTPUT_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ambil URL video dari release
        if: ${{ github.event.inputs.upload_tiktok == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          sleep 5
          VIDEO_URL=$(gh api repos/${{ github.repository }}/releases/tags/tiktok_video \
            --jq '.assets[0].browser_download_url')
          if [ -z "$VIDEO_URL" ] || [ "$VIDEO_URL" = "null" ]; then
            echo "❌ Gagal mendapatkan URL video dari release"
            exit 1
          fi
          echo "VIDEO_URL=${VIDEO_URL}" >> $GITHUB_ENV
          echo "✅ URL video: ${VIDEO_URL}"

      - name: Upload TikTok via Buffer API
        if: ${{ github.event.inputs.upload_tiktok == 'true' }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: "6a2032d8c687a22dd457622f"
          TIKTOK_CAPTION: ${{ github.event.inputs.tiktok_description }}
          VIDEO_URL: ${{ env.VIDEO_URL }}
        run: |
          set -e
          echo "📤 Mengirim ke Buffer API..."
      
          python3 <<'PYEOF'
          import os
          import json
          import sys
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone, timedelta
      
          api_key    = os.environ["BUFFER_API_KEY"]
          channel_id = os.environ["BUFFER_CHANNEL_ID"]
          video_url  = os.environ["VIDEO_URL"]
          caption    = os.environ.get("TIKTOK_CAPTION", "")
      
          due_at = (
              datetime.now(timezone.utc)
              + timedelta(minutes=1)
          ).strftime("%Y-%m-%dT%H:%M:%S.000Z")
      
          print(f"📅 Jadwal tayang : {due_at}")
          print(f"🎬 Video URL     : {video_url}")
      
          mutation = """
          mutation {
            createPost(input: {
              text: %(caption)s
              channelId: %(channel_id)s
              schedulingType: automatic
              mode: customScheduled
              dueAt: %(due_at)s
              assets: [{ video: { url: %(video_url)s } }]
            }) {
              ... on PostActionSuccess {
                post { id dueAt }
              }
              ... on MutationError {
                message
              }
            }
          }
          """ % {
              "caption": json.dumps(caption),
              "channel_id": json.dumps(channel_id),
              "due_at": json.dumps(due_at),
              "video_url": json.dumps(video_url),
          }
      
          payload = json.dumps({"query": mutation}).encode("utf-8")
      
          req = urllib.request.Request(
              "https://api.buffer.com",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + api_key,
              }
          )
      
          try:
              with urllib.request.urlopen(req) as res:
                  body = json.loads(res.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print(f"HTTP Error {e.code}: {e.read().decode()}")
              sys.exit(1)
      
          print(json.dumps(body, indent=2))
          PYEOF

      - name: Finished
        run: |
          echo "🎉 All tasks completed"
