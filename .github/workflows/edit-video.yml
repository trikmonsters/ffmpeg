name: Video Editor + Multi Platform Upload (Max Quality Boost)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Source video URL'
        required: true
      output_filename:
        description: 'Output filename (without .mp4)'
        required: true
        default: 'video-001'
      logo_image_url:
        description: 'Logo image URL'
        required: false
        default: ''
      logo_width:
        description: 'Logo width'
        required: false
        default: '200'
      logo_position:
        description: 'Logo position (top-left, top-center, top-right, bottom-left, bottom-center, bottom-right)'
        required: false
        default: 'top-center'
      logo_opacity:
        description: 'Logo opacity'
        required: false
        default: '0.9'
      logo_margin:
        description: 'Logo margin'
        required: false
        default: '20'
      post_title:
        description: 'Post title'
        required: true
        default: 'My Short Video'
      post_description:
        description: 'Post description'
        required: false
        default: 'Check this out!'
      post_tags:
        description: 'Tags'
        required: false
        default: 'shorts,viral,fyp'
      tiktok_description:
        description: 'TikTok caption'
        required: false
        default: 'Cool video! #fyp #viral'
      upload_youtube:
        description: 'Upload to YouTube'
        required: false
        default: 'true'
      upload_facebook:
        description: 'Upload to Facebook'
        required: false
        default: 'true'
      upload_tiktok:
        description: 'Upload to TikTok'
        required: false
        default: 'true'
      fb_access_token:
        description: 'Facebook Access Token'
        required: false
        default: ''
      fb_page_id:
        description: 'Facebook Page ID'
        required: false
        default: ''

jobs:
  edit-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          pip install \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2 \
            google-api-python-client \
            requests \
            Pillow
          ffmpeg -version | head -1
          echo "✅ Dependencies installed"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Prepare workspace
        run: |
          set -e
          mkdir -p media
          SAFE_NAME=$(echo "${{ github.event.inputs.output_filename }}" | tr -cd '[:alnum:]_-')
          echo "SAFE_NAME=${SAFE_NAME}" >> $GITHUB_ENV
          echo "FINAL_OUTPUT=media/${SAFE_NAME}.mp4" >> $GITHUB_ENV
          echo "✅ SAFE_NAME: ${SAFE_NAME}"

      # ─── DOWNLOAD VIDEO (Playwright) ───────────────────────────────────────────
      - name: Download video
        run: |
          cat > script.mjs <<'EOF'
          import fs from "fs";
          import { chromium } from "playwright";

          const MAX_RETRIES = 3;
          let lastError;

          const browser = await chromium.launch({
            headless: true,
            args: ["--no-sandbox"]
          });

          for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
            console.log(`\n=== Attempt ${attempt}/${MAX_RETRIES} ===`);
            const context = await browser.newContext({ acceptDownloads: true });
            const page = await context.newPage();
            try {
              console.log("Loading page...");
              await page.goto("https://ytshortsdl.io/", {
                timeout: 30000,
                waitUntil: "domcontentloaded"
              });

              console.log("Filling URL input...");
              const input = page.locator("input").first();
              await input.waitFor({ state: "visible", timeout: 15000 });
              await input.fill(process.env.SHORT_URL);
              await input.press("Enter");

              console.log("Waiting for download button...");
              await page.waitForSelector("button.download", {
                state: "visible",
                timeout: 60000
              });
              const btn = page.locator("button.download");

              try {
                const popupPromise = page.waitForEvent("popup", { timeout: 10000 });
                await btn.click({ force: true });
                const popup = await popupPromise;
                await popup.close();
                console.log("Popup dismissed.");
              } catch {
                console.log("No popup detected.");
              }

              await page.waitForTimeout(2000);

              console.log("Starting download...");
              const downloadPromise = page.waitForEvent("download", { timeout: 60000 });
              await btn.click({ force: true });
              const download = await downloadPromise;

              // Simpan langsung sebagai input_video.mp4 agar langsung dipakai ffmpeg
              await download.saveAs("input_video.mp4");
              console.log("✅ Download success: input_video.mp4");

              await context.close();
              await browser.close();
              process.exit(0);
            } catch (err) {
              lastError = err;
              console.error(`Attempt ${attempt} failed: ${err.message}`);
              await context.close();
              if (attempt < MAX_RETRIES) {
                const waitSec = attempt * 10;
                console.log(`Waiting ${waitSec}s before retry...`);
                await new Promise(r => setTimeout(r, waitSec * 1000));
              }
            }
          }

          await browser.close();
          console.error(`All ${MAX_RETRIES} attempts failed.`);
          console.error(lastError);
          process.exit(1);
          EOF
          node script.mjs
        env:
          SHORT_URL: ${{ github.event.inputs.video_url }}

      - name: Validate downloaded video
        run: |
          set -e
          echo "📊 File size: $(du -sh input_video.mp4 | cut -f1)"

          MIME=$(file --mime-type -b input_video.mp4)
          echo "📄 MIME type detected: $MIME"
          if echo "$MIME" | grep -qE "html|text|xml"; then
            echo "❌ Downloaded file is not a video (got HTML/text)"
            head -c 500 input_video.mp4
            exit 1
          fi

          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_type \
            -of csv=p=0 input_video.mp4 2>&1 | grep -q "video" || {
            echo "❌ ffprobe cannot detect video stream"
            ffprobe -v error input_video.mp4 2>&1 | tail -5
            exit 1
          }

          echo "✅ Video validation passed"
      # ───────────────────────────────────────────────────────────────────────────

      - name: Download logo
        if: ${{ github.event.inputs.logo_image_url != '' }}
        run: |
          set -e
          curl -f -L -o logo_original.png "${{ github.event.inputs.logo_image_url }}"
          echo "✅ Logo downloaded successfully"

      - name: Prepare logo
        if: ${{ github.event.inputs.logo_image_url != '' }}
        run: |
          set -e
          python3 scripts/prepare_logo.py \
            --input logo_original.png \
            --output logo_ready.png \
            --width "${{ github.event.inputs.logo_width }}" \
            --opacity "${{ github.event.inputs.logo_opacity }}"

      - name: Edit video
        run: |
          set -e

          POSISI="${{ github.event.inputs.logo_position }}"
          MARGIN="${{ github.event.inputs.logo_margin }}"

          LOGO_EXISTS=false
          [ -f "logo_ready.png" ] && LOGO_EXISTS=true

          echo "🎬 Processing video in Max Quality Mode..."

          if [ "$LOGO_EXISTS" = "true" ]; then

            case "$POSISI" in
              top-left)      OVERLAY_X="$MARGIN";       OVERLAY_Y="$MARGIN" ;;
              top-center)    OVERLAY_X="(W-w)/2";       OVERLAY_Y="$MARGIN" ;;
              top-right)     OVERLAY_X="W-w-$MARGIN";   OVERLAY_Y="$MARGIN" ;;
              bottom-left)   OVERLAY_X="$MARGIN";       OVERLAY_Y="H-h-$MARGIN" ;;
              bottom-center) OVERLAY_X="(W-w)/2";       OVERLAY_Y="H-h-$MARGIN" ;;
              bottom-right)  OVERLAY_X="W-w-$MARGIN";   OVERLAY_Y="H-h-$MARGIN" ;;
              *)             OVERLAY_X="(W-w)/2";       OVERLAY_Y="$MARGIN" ;;
            esac

            ffmpeg -y \
              -i input_video.mp4 \
              -i logo_ready.png \
              -i media/transisi/GJ.mp4 \
              -filter_complex \
              "[0:v]scale=1440:2560:flags=lanczos,setsar=1,setpts=PTS/1.1,unsharp=5:5:2.0:5:5:0.7,eq=contrast=1.40:brightness=0.05:saturation=1.10:gamma=1.05,format=yuv420p[base];\
              [base][1:v]overlay=${OVERLAY_X}:${OVERLAY_Y}[mainv];\
              [0:a]atempo=1.1,loudnorm=I=-14:LRA=11:TP=-1.5[maina];\
              [2:v]scale=1440:2560:flags=lanczos,setsar=1,format=yuv420p,setpts=PTS-STARTPTS[tv];\
              [2:a]asetpts=PTS-STARTPTS[ta];\
              [mainv][maina][tv][ta]concat=n=2:v=1:a=1[vout][aout]" \
              -map "[vout]" \
              -map "[aout]" \
              -c:v libx265 \
              -tag:v hvc1 \
              -r 30 \
              -preset medium \
              -crf 19 \
              -profile:v main \
              -level 5.1 \
              -pix_fmt yuv420p \
              -movflags +faststart \
              -c:a aac \
              -b:a 192k \
              -ar 48000 \
              "${{ env.FINAL_OUTPUT }}"

          else

            ffmpeg -y \
              -i input_video.mp4 \
              -i media/transisi/GJ.mp4 \
              -filter_complex \
              "[0:v]scale=1440:2560:flags=lanczos,setsar=1,setpts=PTS/1.1,eq=contrast=1.45:brightness=0.01:saturation=1.08:gamma=0.95,format=yuv420p[mainv];\
              [0:a]atempo=1.1,loudnorm=I=-14:LRA=11:TP=-1.5[maina];\
              [1:v]scale=1440:2560:flags=lanczos,setsar=1,format=yuv420p,setpts=PTS-STARTPTS[tv];\
              [1:a]asetpts=PTS-STARTPTS[ta];\
              [mainv][maina][tv][ta]concat=n=2:v=1:a=1[vout][aout]" \
              -map "[vout]" \
              -map "[aout]" \
              -c:v libx264 \
              -preset fast \
              -crf 22 \
              -pix_fmt yuv420p \
              -movflags +faststart \
              -c:a aac \
              -b:a 192k \
              -ar 48000 \
              "${{ env.FINAL_OUTPUT }}"

          fi

      - name: Upload YouTube
        if: ${{ github.event.inputs.upload_youtube == 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -e
          python3 scripts/upload_youtube.py \
            --file "${{ env.FINAL_OUTPUT }}" \
            --title "${{ github.event.inputs.post_title }}" \
            --description "${{ github.event.inputs.post_description }}" \
            --tags "${{ github.event.inputs.post_tags }}"

      - name: Upload Facebook Reels
        if: ${{ github.event.inputs.upload_facebook == 'true' }}
        run: |
          set -e
          python3 scripts/upload_facebook.py \
            --file "${{ env.FINAL_OUTPUT }}" \
            --page-id "${{ github.event.inputs.fb_page_id }}" \
            --access-token "${{ github.event.inputs.fb_access_token }}" \
            --title "${{ github.event.inputs.post_title }}" \
            --description "${{ github.event.inputs.post_description }}" \
            --tags "${{ github.event.inputs.post_tags }}"

      - name: Delete old release
        if: ${{ github.event.inputs.upload_tiktok == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "🗑️ Checking for old releases..."
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases \
            --jq '.[] | select(.tag_name == "tiktok_video") | .id' 2>/dev/null || echo "")
          if [ -n "$RELEASE_ID" ]; then
            echo "Deleting release ID: $RELEASE_ID"
            gh api -X DELETE repos/${{ github.repository }}/releases/$RELEASE_ID
            sleep 2
            gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/tiktok_video || true
            sleep 2
            echo "✅ Old release deleted"
          else
            echo "ℹ️ No old release found"
          fi

      - name: Upload video to GitHub Release
        if: ${{ github.event.inputs.upload_tiktok == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "📦 Creating GitHub release..."
          gh release create tiktok_video \
            --repo "${{ github.repository }}" \
            --title "TikTok Video (temporary hosting)" \
            --notes "Temporary hosting for Buffer API. Automatically replaced on next run." \
            "${{ env.FINAL_OUTPUT }}"
          echo "✅ Release created successfully"

      - name: Get video URL from release
        if: ${{ github.event.inputs.upload_tiktok == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          sleep 5
          VIDEO_URL=$(gh api repos/${{ github.repository }}/releases/tags/tiktok_video \
            --jq '.assets[0].browser_download_url')
          if [ -z "$VIDEO_URL" ] || [ "$VIDEO_URL" = "null" ]; then
            echo "❌ Failed to get video URL from release"
            exit 1
          fi
          echo "VIDEO_URL=${VIDEO_URL}" >> $GITHUB_ENV
          echo "✅ Video URL: ${VIDEO_URL}"

      - name: Upload TikTok via Buffer API
        if: ${{ github.event.inputs.upload_tiktok == 'true' }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: "6a2032d8c687a22dd457622f"
          TIKTOK_CAPTION: ${{ github.event.inputs.tiktok_description }}
          VIDEO_URL: ${{ env.VIDEO_URL }}
        run: |
          set -e
          echo "📤 Sending to Buffer API..."
          python3 - <<'PYEOF'
          import os
          import json
          import sys
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone, timedelta

          api_key = os.environ["BUFFER_API_KEY"]
          channel_id = os.environ["BUFFER_CHANNEL_ID"]
          video_url = os.environ["VIDEO_URL"]
          caption = os.environ.get("TIKTOK_CAPTION", "")

          due_at = (
              datetime.now(timezone.utc) + timedelta(minutes=1)
          ).strftime("%Y-%m-%dT%H:%M:%S.000Z")

          print(f"📅 Scheduled time : {due_at}")
          print(f"🎬 Video URL      : {video_url}")

          mutation = (
              "mutation { createPost(input: {"
              "  text: " + json.dumps(caption) +
              "  channelId: " + json.dumps(channel_id) +
              "  schedulingType: automatic"
              "  mode: customScheduled"
              "  dueAt: " + json.dumps(due_at) +
              "  assets: [{ video: { url: " + json.dumps(video_url) + " } }]"
              "}) {"
              "  ... on PostActionSuccess { post { id dueAt } }"
              "  ... on MutationError { message }"
              "} }"
          )

          payload = json.dumps({"query": mutation}).encode("utf-8")

          req = urllib.request.Request(
              "https://api.buffer.com/graphql",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + api_key,
              }
          )

          try:
              with urllib.request.urlopen(req) as res:
                  body = json.loads(res.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print(f"HTTP Error {e.code}: {e.read().decode()}")
              sys.exit(1)

          print(json.dumps(body, indent=2))
          PYEOF

      - name: Done
        run: |
          echo "🎉 All tasks completed"
