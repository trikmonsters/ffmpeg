name: Download Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Masukkan URL Video (YT/TikTok/FB/dll)'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repositori (opsional, tapi bagus untuk struktur)
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Install FFmpeg (wajib untuk menggabungkan video & audio kualitas tinggi)
    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    # 3. Install yt-dlp versi terbaru
    - name: Install yt-dlp
      run: |
        sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
        sudo chmod a+rx /usr/local/bin/yt-dlp

    # 4. Proses Download Video
    - name: Download Video via yt-dlp
      run: |
        mkdir downloads
        cd downloads
        # Format mp4 otomatis mencari kualitas terbaik yang menggabungkan video+audio
        yt-dlp -f "b[ext=mp4]/b" "${{ github.event.inputs.video_url }}"

    
