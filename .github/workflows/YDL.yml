name: Download Video Universal API

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Masukkan URL Video (YT/TikTok/FB/dll)'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download Video via Public API Engine
      run: |
        mkdir downloads
        cd downloads
        
        echo "Mengirim permintaan konversi video..."
        
        # Menggunakan API publik pihak ketiga untuk bypass enkripsi YouTube/TikTok/FB
        # API ini mengembalikan direct link video mp4 kualitas terbaik
        API_REQ=$(curl -s -X POST "https://api.v02.savethevideo.com/tasks" \
          -H "Content-Type: application/json" \
          -d "{\"url\": \"${{ github.event.inputs.video_url }}\"}")
        
        # Mengambil ID Task untuk pengecekan status download
        TASK_ID=$(echo "$API_REQ" | grep -o '"id":"[^"]*' | grep -o '[^"]*$')
        
        if [ -z "$TASK_ID" ]; then
          echo "Gagal menginisiasi download. Mencoba API Cadangan..."
          # API Cadangan jika API utama sibuk
          DOWNLOAD_URL=$(curl -s "https://api.dandi.link/api/download?url=${{ github.event.inputs.video_url }}" | grep -o '"download_url":"[^"]*' | grep -o '[^"]*$')
        else
          echo "Menunggu server memproses video (Task ID: $TASK_ID)..."
          sleep 5
          
          # Mengambil link unduhan final dari hasil pemrosesan task
          DOWNLOAD_URL=$(curl -s "https://api.v02.savethevideo.com/tasks/$TASK_ID" | grep -o '"url":"[^"]*' | grep -o '[^"]*$' | head -n 1)
        fi
        
        if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
          echo "Error: Gagal mendapatkan link download dari API. Server kemungkinan sedang overload."
          exit 1
        fi
        
        echo "Link download berhasil didapatkan!"
        echo "Memulai proses unduhan file video asli..."
        
        # Download file video final dan simpan sebagai video.mp4
        curl -L -o "video.mp4" "$DOWNLOAD_URL"

    
