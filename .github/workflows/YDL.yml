name: Download Video via Node.js

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Masukkan URL YouTube'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Downloader CLI
      run: npm install -g @distube/ytdl-core --unsafe-perm

    - name: Download Video
      run: |
        mkdir downloads
        cd downloads
        # Mengunduh menggunakan cli ytdl
        ytdl "${{ github.event.inputs.video_url }}" --quality highest -o video.mp4

    
