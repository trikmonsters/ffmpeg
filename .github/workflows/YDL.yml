name: Download Video via Alt API

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Masukkan URL Video'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download Menggunakan Invidious API
      run: |
        mkdir downloads
        cd downloads
        
        # Menggunakan instance publik invidious untuk mengambil direct link video tanpa blokir
        VIDEO_ID=$(echo "${{ github.event.inputs.video_url }}" | grep -oE 'v=[^&]+|shorts/[^?]+|youtu.be/[^?]+' | head -n 1 | sed -E 's/v=|shorts\/|youtu.be\///')
        
        if [ -z "$VIDEO_ID" ]; then
          echo "Format URL tidak dikenal, mencoba download langsung..."
          curl -L -o "video.mp4" "${{ github.event.inputs.video_url }}"
        else
          echo "Mengekstrak ID Video: $VIDEO_ID"
          # Ambil link video format mp4 dari public API
          DATA=$(curl -s "https://iv.melmac.space/api/v1/videos/$VIDEO_ID")
          DOWNLOAD_URL=$(echo "$DATA" | grep -o '"url":"[^"]*' | grep -o '[^"]*' | grep "mime=video%2Fmp4" | head -n 1 | sed 's/\\u0026/\&/g')
          
          if [ -z "$DOWNLOAD_URL" ]; then
             echo "Gagal lewat API khusus, mengalihkan ke fallback..."
             exit 1
          fi
          
          curl -L -o "video.mp4" "$DOWNLOAD_URL"
        fi

