name: Download Video (Auto Proxy & No Cookies)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Masukkan URL Video (YT/TikTok/FB/dll)'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python & Dependencies
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install yt-dlp Versi Terbaru
      run: |
        sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
        sudo chmod a+rx /usr/local/bin/yt-dlp

    - name: Proses Download Menggunakan Proxy
      run: |
        mkdir downloads
        cd downloads
        
        echo "Mencari proxy publik gratis yang aktif..."
        # Mengambil daftar proxy gratis dari API publik terpercaya
        PROXY_LIST=$(curl -s "https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=5000&country=all&ssl=all&anonymity=all")
        
        # Mengambil 5 proxy teratas untuk dicoba satu per satu jika ada yang gagal
        PROXIES=$(echo "$PROXY_LIST" | head -n 5)
        
        DOWNLOAD_SUCCESS=false
        
        for PROXY in $PROXIES; do
          if [ ! -z "$PROXY" ]; then
            echo "Mencoba mendownload menggunakan proxy: http://$PROXY"
            
            # Menjalankan yt-dlp dengan menyamar sebagai iOS client lewat jalur proxy
            if yt-dlp -f "b[ext=mp4]/b" \
              --proxy "http://$PROXY" \
              --extractor-args "youtube:player_client=ios" \
              --socket-timeout 15 \
              "${{ github.event.inputs.video_url }}"; then
              
              echo "✅ Download berhasil menggunakan proxy ini!"
              DOWNLOAD_SUCCESS=true
              break
            fi
            echo "⚠️ Proxy http://$PROXY gagal atau lambat, mencoba proxy berikutnya..."
          fi
        done
        
        # Fallback terakhir jika semua proxy gagal: coba download langsung tanpa proxy memakai client iOS murni
        if [ "$DOWNLOAD_SUCCESS" = false ]; then
          echo "🚨 Semua proxy gagal. Mencoba taktik fallback terakhir (Direct iOS Client)..."
          yt-dlp -f "b[ext=mp4]/b" --extractor-args "youtube:player_client=ios,mweb" "${{ github.event.inputs.video_url }}"
        fi

    
