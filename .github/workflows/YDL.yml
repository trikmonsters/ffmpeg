name: Download Video via Cobalt

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Masukkan URL Video (YT/TikTok/FB/dll)'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Download Video menggunakan Cobalt API
      run: |
        mkdir downloads
        cd downloads
        
        echo "Mengirim request ke API Cobalt..."
        # Meminta link download mentah dari API Cobalt
        RESPONSE=$(curl -s -X POST "https://api.cobalt.tools/api/json" \
          -H "Content-Type: application/json" \
          -H "Accept: application/json" \
          -d "{\"url\": \"${{ github.event.inputs.video_url }}\", \"vQuality\": \"720\"}")
        
        # Mengambil URL video hasil ekstraksi
        DOWNLOAD_URL=$(echo $RESPONSE | grep -o '"url":"[^"]*' | grep -o '[^"]*$')
        
        if [ -z "$DOWNLOAD_URL" ]; then
          echo "Gagal mengambil video. Respon dari server: $RESPONSE"
          exit 1
        fi
        
        echo "Mendownload file video asli..."
        # Mengunduh video asli dengan nama video.mp4
        curl -L -o "video.mp4" "$DOWNLOAD_URL"

  
