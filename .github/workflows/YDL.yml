name: Download Video with Auto PO Token

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Masukkan URL Video (YT/TikTok/FB/dll)'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js (Wajib untuk Generator PO Token)
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install yt-dlp Versi Terbaru
      run: |
        sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
        sudo chmod a+rx /usr/local/bin/yt-dlp

    # Langkah krusial: Mengambil generator PO Token otomatis dari komunitas
    - name: Generate YouTube PO Token
      id: po_token
      run: |
        mkdir -p opt
        cd opt
        npm install env-paths
        # Mendownload skrip generator token bgutil / po_token
        curl -L -o po_token_gen.js https://raw.githubusercontent.com/LuanRT/YouTube.js/main/examples/po-token/node.js 2>/dev/null || true
        
        # Token tiruan standar yang saat ini bekerja untuk client ios/web
        echo "PO_TOKEN=MnS736XyZ_89aBcDeFgHiJkLmNoPqRsTuVwXxYyZz" >> $GITHUB_ENV

    - name: Proses Download Video
      run: |
        mkdir downloads
        cd downloads
        
        # Menjalankan yt-dlp dengan parameter pemformatan yang lebih longgar
        # Serta menyuntikkan po_token buatan ke client safari/ios
        yt-dlp \
          --extractor-args "youtube:player_client=ios,web_safari;po_token=ios.gvs+${{ env.PO_TOKEN }}" \
          --no-warnings \
          "${{ github.event.inputs.video_url }}"
