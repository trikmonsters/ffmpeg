name: Upload TikTok via Buffer API

on:
  workflow_dispatch:
    inputs:
      tiktok_description:
        description: 'Caption/Deskripsi TikTok'
        required: false
        default: 'Halo dari GitHub Actions! 🚀 #test'

jobs:
  upload-tiktok:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Video URL Variable
        run: |
          # Gantilah VIDEO_URL ini dengan URL video publik milikmu jika berbeda
          echo "VIDEO_URL=https://github.com/trikmonsters/ffmpeg/releases/download/tiktok_video/video-20260724-1336.mp4" >> $GITHUB_ENV

      - name: Upload TikTok via Buffer API
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: "6a2032d8c687a22dd457622f"
          TIKTOK_CAPTION: ${{ github.event.inputs.tiktok_description }}
          VIDEO_URL: ${{ env.VIDEO_URL }}
        run: |
          set -e
          echo "📤 Sending post payload to Buffer API..."
          python3 - <<'PYEOF'
          import os
          import json
          import sys
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone, timedelta

          api_key = os.environ["BUFFER_API_KEY"]
          channel_id = os.environ["BUFFER_CHANNEL_ID"]
          video_url = os.environ["VIDEO_URL"]
          caption = os.environ.get("TIKTOK_CAPTION", "")

          # Jadwalkan 1 menit ke depan
          due_at = (datetime.now(timezone.utc) + timedelta(minutes=1)).strftime("%Y-%m-%dT%H:%M:%S.000Z")

          print(f"📅 Scheduled time : {due_at}")
          print(f"🎬 Video URL      : {video_url}")
          print(f"📝 Caption        : {caption}")

          # Format mutation GraphQL sesuai dokumentasi resmi Buffer (Inline Values)
          mutation = f"""
          mutation CreatePost {{
            createPost(
              input: {{
                text: {json.dumps(caption)}
                channelId: {json.dumps(channel_id)}
                schedulingType: automatic
                mode: customScheduled
                dueAt: {json.dumps(due_at)}
                assets: [{{ video: {{ url: {json.dumps(video_url)} }} }}]
              }}
            ) {{
              ... on PostActionSuccess {{
                post {{
                  id
                  dueAt
                }}
              }}
              ... on MutationError {{
                message
              }}
            }}
          }}
          """

          payload = json.dumps({"query": mutation}).encode("utf-8")

          req = urllib.request.Request(
              "https://api.buffer.com",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {api_key}",
              }
          )

          try:
              with urllib.request.urlopen(req) as res:
                  body = json.loads(res.read().decode("utf-8"))
                  print("--- Response Buffer API ---")
                  print(json.dumps(body, indent=2))
          except urllib.error.HTTPError as e:
              print(f"❌ HTTP Error {e.code}: {e.read().decode()}")
              sys.exit(1)
          PYEOF
