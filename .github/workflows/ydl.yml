name: Download

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Source video URL'
        required: true
        default: 'https://youtube.com/shorts/noOz4s8vGXU?si=-WnADN-pIbledCFg'
      output_filename:
        description: 'Output filename (without .mp4)'
        required: true
        default: 'video-001'
      

jobs:
  edit-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      # OPTIMASI: Hanya mengambil commit terakhir (Shallow Clone) agar sangat cepat
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download video via AnyDownloader API
        run: |
          set -e
          echo "📥 Menghubungi AnyDownloader API Gateway..."
          
          # 1. Request data video ke API AnyDownloader
          RESPONSE=$(curl -s "https://api.anydownloader.com/api/get-video-info?url=${{ github.event.inputs.video_url }}")
          
          echo "🔍 Mengekstrak Direct Link MP4..."
          # 2. Menggunakan Python untuk mengambil URL video pertama dari array 'medias'
          STREAM_URL=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              # Ambil item pertama dari daftar media yang tersedia
              print(data.get('medias', [{}])[0].get('url', ''))
          except Exception:
              print('')
          ")

          if [ -z "$STREAM_URL" ] || [ "$STREAM_URL" = "None" ]; then
            echo "❌ Gagal mendapatkan link video dari AnyDownloader!"
            echo "Respon Mentah Server: $RESPONSE"
            exit 1
          fi

          echo "🔗 Direct Link Berhasil Didapatkan!"
          echo "📥 Mengunduh file video ke workspace..."
          
          # 3. Proses download akhir file MP4 menggunakan curl dengan User-Agent normal
          curl -f -L \
            --max-time 150 \
            --retry 3 \
            --retry-delay 5 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -o input_video.mp4 \
            "$STREAM_URL"

          # 4. Validasi akhir menggunakan ffprobe untuk memastikan file benar-benar video siap edit
          ffprobe input_video.mp4 > /dev/null 2>&1 || {
            echo "❌ File hasil unduhan rusak atau bukan format video valid!"
            exit 1
          }
          echo "✅ Download video sukses dan file valid!"

      
