name: Test YouTube Downloader (Bypass Cookie)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Masukkan URL YouTube untuk Test'
        required: true
        default: 'https://youtube.com/shorts/MpLpB3TAlKo'

jobs:
  test-downloaders:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download video via SaveFrom API
        run: |
          set -e
          echo "📥 Menghubungi SaveFrom API Server..."
          
          # 1. Request data video ke API gateway
          RESPONSE=$(curl -s -X POST "https://worker.sf-api.com/savefrom" \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"${{ github.event.inputs.video_url }}\"}")
          
          echo "🔍 Memilih kualitas video terbaik..."
          # 2. Mengkstrak url MP4 kualitas terbaik menggunakan skrip Python otomatis
          STREAM_URL=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              # Mencari link download di dalam array 'url' pertama yang tipenya video/mp4
              urls = data.get('url', [])
              mp4_links = [u.get('url') for u in urls if 'mp4' in u.get('ext', '') or 'video' in u.get('type', '')]
              print(mp4_links[0] if mp4_links else '')
          except:
              print('')
          ")

          if [ -z "$STREAM_URL" ] || [ "$STREAM_URL" = "None" ]; then
            echo "❌ Gagal mendapatkan link dari SaveFrom API."
            echo "Respon Server: $RESPONSE"
            exit 1
          fi

          echo "📥 Memulai pengunduhan file video..."
          # 3. Proses download akhir file MP4
          curl -f -L \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            -o input_video.mp4 \
            "$STREAM_URL"

          echo "✅ Download sukses 100% Free!"
