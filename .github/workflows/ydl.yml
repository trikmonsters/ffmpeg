name: Download

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Source video URL'
        required: true
        default: 'https://youtube.com/shorts/noOz4s8vGXU?si=-WnADN-pIbledCFg'
      output_filename:
        description: 'Output filename (without .mp4)'
        required: true
        default: 'video-001'
      

jobs:
  edit-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      # OPTIMASI: Hanya mengambil commit terakhir (Shallow Clone) agar sangat cepat
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download video via Active Public API
        run: |
          set -e
          echo "📥 Menghubungi API Gateway (Jalur Cepat)..."
          
          # Menggunakan API pihak ketiga dari taptap/v0 yang saat ini aktif mengekstrak video YouTube
          RESPONSE=$(curl -s -X POST "https://api.v0.wtf/api/youtube" \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"${{ github.event.inputs.video_url }}\"}")

          echo "🔍 Membaca respons data streaming..."
          # Ekstraksi link unduhan mp4 langsung menggunakan python inline
          STREAM_URL=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              # Mencari URL video langsung dari objek response
              print(data.get('url', ''))
          except:
              print('')
          ")

          # JALUR CADANGAN: Jika API Utama mati, otomatis ganti ke server nodownload proxy
          if [ -z "$STREAM_URL" ] || [ "$STREAM_URL" = "None" ]; then
            echo "⚠️ Jalur utama sibuk, mencoba jalur cadangan..."
            RESPONSE=$(curl -s "https://api.anydownloader.com/api/get-video-info?url=${{ github.event.inputs.video_url }}")
            STREAM_URL=$(echo "$RESPONSE" | python3 -c "
            import sys, json
            try:
                data = json.load(sys.stdin)
                # Ambil link kualitas video mp4 pertama dari array
                print(data.get('medias', [{}])[0].get('url', ''))
            except:
                print('')
            ")
          fi

          if [ -z "$STREAM_URL" ] || [ "$STREAM_URL" = "None" ]; then
            echo "❌ Gagal mendapatkan link video dari semua API gratisan."
            echo "Log Respons Akhir Server: $RESPONSE"
            exit 1
          fi

          echo "🔗 Tautan langsung berhasil didapatkan!"
          echo "📥 Mengunduh file video ke workspace..."
          
          # Mengunduh video asli secara cepat langsung ke file target
          curl -f -L \
            --max-time 150 \
            --retry 2 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -o input_video.mp4 \
            "$STREAM_URL"

          # Validasi akhir untuk memastikan file utuh dan bukan html/text rusak
          ffprobe input_video.mp4 > /dev/null 2>&1 || {
            echo "❌ File hasil unduhan korup atau tidak valid!"
            exit 1
          }
          echo "✅ Download video sukses dan file valid!"

      # ... (Sisa langkah edit video dan upload ke TikTok/YT/FB milik Anda silakan lanjutkan di bawahnya) ...
