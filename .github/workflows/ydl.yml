name: Test YouTube Downloader (Bypass Cookie)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Masukkan URL YouTube untuk Test'
        required: true
        default: 'https://youtube.com/shorts/MpLpB3TAlKo'

jobs:
  test-downloaders:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download video via Cobalt Alternative Mirror
        run: |
          set -e
          echo "📥 Meminta direct link dari Cobalt Mirror..."
          
          # Kita gunakan mirror 'co.wuk.sh' atau 'cobalt.lol' yang biasanya lebih longgar
          STREAM_URL=$(curl -s -X POST "https://co.wuk.sh/api/json" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"url\": \"${{ github.event.inputs.video_url }}\", \"vQuality\": \"1080\"}" \
            | python3 -c "import sys, json; print(json.load(sys.stdin).get('url', ''))")

          if [ -z "$STREAM_URL" ] || [ "$STREAM_URL" = "None" ]; then
            echo "❌ Mirror 1 gagal, mencoba Mirror 2..."
            STREAM_URL=$(curl -s -X POST "https://api.cobalt.lol/api/json" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d "{\"url\": \"${{ github.event.inputs.video_url }}\", \"vQuality\": \"1080\"}" \
              | python3 -c "import sys, json; print(json.load(sys.stdin).get('url', ''))")
          fi

          if [ -z "$STREAM_URL" ] || [ "$STREAM_URL" = "None" ]; then
            echo "❌ Semua API Mirror penuh. Disarankan beralih ke Trik 1 (OAuth2)."
            exit 1
          fi

          echo "🔗 Direct Link Sukses Didapatkan!"
          echo "📥 Mengunduh file video..."
          curl -f -L \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -o input_video.mp4 \
            "$STREAM_URL"

          echo "✅ Download sukses via Cobalt Mirror!"
