name: Test YouTube Downloader (Bypass Cookie)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Masukkan URL YouTube untuk Test'
        required: true
        default: 'https://youtube.com/shorts/MpLpB3TAlKo'

jobs:
  test-downloaders:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download video via Public API
        run: |
          set -e
          echo "📥 Meminta konversi video dari Public API..."
          
          # 1. Mengirim request ke API untuk convert URL YouTube
          RESPONSE=$(curl -s -X POST "https://taylor.metube.id/api/v1/download" \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"${{ github.event.inputs.video_url }}\"}")
          
          echo "🔍 Mengekstrak link unduhan..."
          # 2. Mengambil direct link video resolusi tertinggi (MP4) menggunakan Python
          STREAM_URL=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              # Mengambil url video matang dari response API
              print(data.get('data', {}).get('url', ''))
          except:
              print('')
          ")

          if [ -z "$STREAM_URL" ] || [ "$STREAM_URL" = "None" ]; then
            echo "❌ API sedang overload atau link tidak valid."
            echo "Respon Server: $RESPONSE"
            exit 1
          fi

          echo "📥 Mengunduh video asli dari server..."
          # 3. Download langsung file video aslinya
          curl -f -L \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            -o input_video.mp4 \
            "$STREAM_URL"

          echo "✅ Video berhasil diunduh gratis tanpa API Key!"
